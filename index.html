<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1a30">
  <title>Next Frontier</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <section class="mission-intro" id="mission-intro" aria-labelledby="intro-title">
    <article class="briefing" id="briefing">
      <figure class="briefing-figure">
        <img class="briefing-image" src="images/conceptual_outpost.jpeg" alt="An imagined Mars base with habitats, a rover and astronauts on the orange surface" draggable="false">
        <figcaption><span data-copy="html2"></span></figcaption>
      </figure>
      <div class="briefing-content">
        <p class="briefing-eyebrow"><span data-copy="html3"></span></p>
        <h1 id="intro-title"><span data-copy="html4"></span></h1>
        <p><span data-copy="html5"></span><strong><span data-copy="html6"></span></strong><span data-copy="html7"></span></p>
        <p><span data-copy="html8"></span></p>
        <button id="start-mission" class="start-mission" type="button"><span data-copy="html9"></span><span aria-hidden="true">→</span></button>
        <p class="briefing-hint"><span data-copy="html10"></span></p>
      </div>
    </article>
  </section>

  <main id="game" hidden>
    <!-- Mission bar: current sol, and the button to end the mission. -->
    <header class="topbar">
      <p class="sol" title="A sol is a day on Mars">
        <svg class="sky-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-30 12 12)"/></svg>
        <span><strong id="sol"><span data-copy="html11"></span></strong><small id="sol-notice" role="status" aria-live="polite"><span data-copy="html12"></span></small></span>
      </p>
      <button class="end-button" id="end-mission" type="button"><span data-copy="html13"></span></button>
    </header>

    <section class="indicators" id="indicators" aria-label="Base indicators"></section>
    <!-- Info box under the indicators: shows the active effects; while an indicator is held,
         its detail covers this box (same size), so no extra space is needed. -->
    <div class="readout" id="readout">
      <section class="effects-box" aria-labelledby="effects-title">
        <h2><span id="effects-title"><span data-copy="html14"></span></span><span class="more" id="active-more"></span></h2>
        <ul id="active-effects"></ul>
      </section>
      <section class="detail empty" id="detail" aria-live="polite"></section>
    </div>

    <!-- The mission card (portrait, 3:4). card-ui.js draws its front and back. -->
    <div class="card-area">
      <section class="card-slot" id="card" aria-label="Mission card"></section>
    </div>
  </main>

  <!-- Decorative day turnover, always behind the game. -->
  <div id="sol-transition" class="sol-transition" aria-hidden="true" hidden></div>

  <!-- Asks before ending, so a stray tap does not end the mission. -->
  <dialog class="confirm" id="end-dialog" aria-labelledby="end-title">
    <h2 id="end-title"><span data-copy="html15"></span></h2>
    <p><span data-copy="html16"></span></p>
    <div class="confirm-actions">
      <button type="button" id="end-cancel" autofocus><span data-copy="html17"></span></button>
      <button type="button" id="end-confirm" class="danger"><span data-copy="html18"></span></button>
    </div>
  </dialog>

  <!-- Classic scripts (no modules) so the game works by opening this file directly. -->
  <script type="module" src="src/bootstrap.js"></script>
</body>
</html>
